name: easy_liboqs
description: Post-quantum cryptography (liboqs) for Dart and Flutter with the native library bundled automatically. Wraps the oqs package, with no manual setup.
version: 4.1.1
repository: https://github.com/bardiakz/easy_liboqs
issue_tracker: https://github.com/bardiakz/easy_liboqs/issues
topics:
  - cryptography
  - post-quantum
  - ml-kem
  - ffi
  - liboqs

environment:
  sdk: ^3.13.1

dependencies:
  archive: ^4.3.0
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  oqs: ^4.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.32.0