name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# A newer run on the same branch/PR cancels the older one still in progress.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the hook + unit tests natively on each OS/CPU, then builds the
  # example app so the bundled library is checked inside a real app bundle.
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: runner labels change over time; check GitHub's runner docs.
          # Linux arm64 has no official Flutter SDK, see the linux-arm64 job below.
          - { name: linux-x64,   os: ubuntu-latest,    build: linux,   experimental: false }
          - { name: macos-arm64, os: macos-latest,     build: macos,   experimental: false }
          - { name: macos-x64,   os: macos-15-intel,   build: macos,   experimental: false }
          # Windows path lookup is not implemented yet; flip to false once it is.
          - { name: windows-x64, os: windows-latest,   build: windows, experimental: true }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # Cache the 70+ MB archive the hook downloads (keyed on versions.yaml).
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: liboqs-${{ matrix.name }}-${{ hashFiles('versions.yaml') }}

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build example app
        working-directory: example
        run: |
          flutter pub get
          flutter build ${{ matrix.build }}

  # Flutter publishes no Linux arm64 SDK, but Dart does and this package is
  # pure Dart, so test the aarch64 binary with plain `dart test`.
  # (Free only for public repos. The example app is not built here.)
  linux-arm64:
    name: linux-arm64 (dart)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: liboqs-linux-arm64-${{ hashFiles('versions.yaml') }}

      # The example/ app needs Flutter, so skip it here.
      - run: dart pub get --no-example
      - run: dart analyze lib hook test
      - run: dart test

  android:
    name: android-emulator-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: flutter pub get
      - run: cd example && flutter pub get

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd example && flutter test integration_test

  # iOS (simulator) is intentionally not here yet: hook/build.dart does not
  # support iOS until the XCFramework slices have been inspected.